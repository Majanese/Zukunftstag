<!doctype html>
<html lang="de-CH"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zukunftstag · Pick a Number</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#183c40;font-family:system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:35px 28px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}.tag{font-size:15px;letter-spacing:.16em;font-weight:750;text-transform:uppercase}h1{font-size:clamp(38px,6vw,68px);margin:8px 0}p{font-size:21px;line-height:1.5}.intro{margin:0 0 28px;color:#50666a}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:15px}button{font:inherit;cursor:pointer;border:0}button:focus-visible{outline:4px solid #e99724;outline-offset:4px}.tile{border-radius:19px;background:#146468;color:white;font-size:42px;font-weight:750;min-height:125px;box-shadow:0 5px 0 #104d50;transition:transform .15s}.tile:hover{transform:translateY(-3px);background:#1b777b}.tile.used{background:#dfe7e3;color:#68807b;box-shadow:0 5px 0 #c7d3cc}.tile.used:after{content:' ✓';font-size:20px}.small{background:white;border:1px solid #b8cbc7;border-radius:12px;padding:12px 17px;font-size:16px;color:#183c40}footer{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:20px}footer p{font-size:16px}dialog{width:min(850px,92vw);border:0;border-radius:28px;padding:42px;background:#fffefa;color:#183c40;box-shadow:0 20px 100px #0004}dialog::backdrop{background:#123b41bb;backdrop-filter:blur(5px)}dialog h2{font-size:clamp(27px,4vw,43px);line-height:1.3;margin:20px 0 30px}.badge{display:inline-block;background:#ffdf8e;border-radius:20px;padding:8px 18px;font-weight:750}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.primary{background:#146468;color:white;border-radius:12px;padding:14px 24px}#clock{margin-left:auto;font-size:26px;font-variant-numeric:tabular-nums}.hint{font-size:17px;color:#647877}@media(max-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.tile{min-height:90px;font-size:32px}header{align-items:flex-start}main{padding:24px 16px}dialog{padding:28px}footer{align-items:flex-start;flex-direction:column}}
</style>
<main><header><div><div class="tag">Unser Zukunftstag</div><h1>Pick a Number!</h1></div><button class="small" id="full">⛶ Vollbild</button></header><p class="intro">Wähle eine Zahl. Entdecke deine Frage. Erzähle kurz von deinem Tag!</p><div class="grid" id="grid"></div><footer><p id="count">0 von 12 Fragen entdeckt</p><button class="small" id="reset">↺ Neu mischen & zurücksetzen</button></footer></main>
<dialog id="card"><span class="badge" id="label"></span><h2 id="question"></h2><p class="hint">Ein bis drei Sätze reichen. Wenn die Frage nicht passt, wähle eine andere Zahl.</p><div class="actions"><button class="primary" id="close">Zurück zu den Zahlen</button><button class="small" id="timer">30 Sekunden starten</button><span id="clock" aria-live="polite"></span></div></dialog>
<script>
const questions=[
'Was durftest du selbst ausprobieren oder mithelfen?',
'Was war dein überraschendster Moment?',
'Welche Aufgabe hat dir besonders gefallen – und warum?',
'Was war schwieriger, als du vorher gedacht hattest?',
'Welches Werkzeug oder Gerät hast du kennengelernt? Wofür braucht man es?',
'Was können die Menschen in diesem Beruf besonders gut? Nenne ein Beispiel.',
'Mit wem hat deine Begleitperson zusammengearbeitet?',
'Wem hilft dieser Beruf im Alltag – und wie?',
'Was wusstest du vor dem Zukunftstag noch nicht über diesen Beruf?',
'Würdest du diesen Beruf gerne einen Tag lang selbst ausüben? Warum?',
'Welche Situation von deinem Tag ist dir besonders in Erinnerung geblieben?',
'Was möchtest du über den Beruf noch herausfinden?'];
let order=[],used=new Set(),interval;const $=id=>document.getElementById(id);function stop(){clearInterval(interval);$('clock').textContent='';$('timer').textContent='30 Sekunden starten'}function draw(){$('grid').replaceChildren();order.forEach((q,i)=>{let b=document.createElement('button');b.className='tile'+(used.has(i)?' used':'');b.textContent=i+1;b.setAttribute('aria-label','Frage '+(i+1)+(used.has(i)?', bereits geöffnet':''));b.onclick=()=>{stop();used.add(i);$('label').textContent='Frage '+(i+1);$('question').textContent=q;draw();$('card').showModal()};$('grid').append(b)});$('count').textContent=used.size+' von 12 Fragen entdeckt'}function reset(){stop();used.clear();order=[...questions];for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}draw()}
$('close').onclick=()=>{$('card').close();stop()};$('card').addEventListener('close',stop);$('timer').onclick=()=>{stop();let n=30;$('clock').textContent='0:30';$('timer').textContent='Neu starten';interval=setInterval(()=>{n--;$('clock').textContent='0:'+String(n).padStart(2,'0');if(n===0){clearInterval(interval);$('clock').textContent='Zeit für den nächsten Beitrag';}},1000)};$('reset').onclick=reset;$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('full').textContent='Browser-Vollbild: F11'}};reset();
</script></html>
